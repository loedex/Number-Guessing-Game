<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Number Guessing Game</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
     <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css" />
    
</head>

<body>
    
    <div class="background-animation"></div>
    <div class="main-container">
        <div class="glass-card">
            <h1 class="title">Guess the Number</h1>
            <p class="subtitle">Think a number between 1 and 100</p>

            <div class="game-area">
                <input type="number" id="guessInput" placeholder="Enter your guess ..." min="1" max="100" class="guess-input">
                <button id="guessBtn" class="action-btn">Check</button>
            </div>

            <div id="messageBox" class="message-box hidden">
                <p id="messageText">message box</p>
            </div>
            <div class="stats">
                <p>Attempts : <span id="attemptsCount">0</span></p>
            </div>

        </div>
    </div>


    <script src="logic.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
